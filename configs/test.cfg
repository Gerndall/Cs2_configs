// ============================================================================
// CS2 PRACTICE CONFIG
// File: test.cfg
// Load with: exec test
// ============================================================================

// ----------------------------------------------------------------------------
// Server setup
// ----------------------------------------------------------------------------

sv_cheats 1

mp_limitteams 0
mp_autoteambalance 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_maxmoney 60000
mp_startmoney 60000
mp_buytime 9999
mp_buy_anywhere 1
mp_freezetime 0
bot_stop 1
mp_restartgame 1


// ----------------------------------------------------------------------------
// Ammunition and grenades
// ----------------------------------------------------------------------------

sv_infinite_ammo 1
ammo_grenade_limit_total 5


// ----------------------------------------------------------------------------
// Grenade trajectory and bullet impacts
// ----------------------------------------------------------------------------

sv_grenade_trajectory_prac_pipreview 1
sv_grenade_trajectory_prac_trailtime 10
sv_showimpacts 1
sv_showimpacts_time 10


// ----------------------------------------------------------------------------
// Player protection
// ----------------------------------------------------------------------------

// Toggles god mode when the config is executed.
god


// ----------------------------------------------------------------------------
// Movement settings
// ----------------------------------------------------------------------------

sv_autobunnyhopping 1
sv_staminamax 0
sv_staminajumpcost 0
sv_staminalandcost 0


// ----------------------------------------------------------------------------
// Debug settings
// ----------------------------------------------------------------------------

cl_showpos 0
weapon_debug_spread_show 0


// ----------------------------------------------------------------------------
// Practice binds
// ----------------------------------------------------------------------------

bind "ALT" "sv_rethrow_last_grenade"
bind "F5"  "mp_restartgame 1"
bind "F6"  "give weapon_smokegrenade; give weapon_flashbang; give weapon_hegrenade; give weapon_molotov; give weapon_incgrenade"
bind "F7"  "ent_teleport player"
bind "F8"  "toggle sv_grenade_trajectory_prac_trailtime 0 10"


echo "============================================================"
echo "[PRACTICE] test.cfg loaded"
echo "[PRACTICE] F5: Restart round"
echo "[PRACTICE] F6: Give grenades"
echo "[PRACTICE] F7: Teleport to crosshair"
echo "[PRACTICE] F8: Toggle grenade trail"
echo "[PRACTICE] ALT: Rethrow last grenade"
echo "============================================================"
sv_cheats 1

// Server Setup
mp_limitteams 0
mp_autoteambalance 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_maxmoney 60000
mp_startmoney 60000
mp_buytime 9999
mp_buy_anywhere 1
mp_freezetime 0
bot_stop 1
mp_restartgame 1

// Infinite Ammo + Nades
sv_infinite_ammo 1
ammo_grenade_limit_total 5

// Trajectory + Impact
sv_grenade_trajectory 1
sv_grenade_trajectory_time 10
sv_showimpacts 1
sv_showimpacts_time 10

// Nade Camera (Flug verfolgen)
sv_grenade_trajectory_prac_pipreview 1

// Auto Re-throw last grenade
bind "ALT" "sv_rethrow_last_grenade"

// Heal + No Damage
god
buddha 1
buddha_reset_hp "100"

// Movement + Utility
sv_autobunnyhopping 1
sv_staminamax 0
sv_staminajumpcost 0
sv_staminalandcost 0

// Show Positions
cl_showpos 0

// Crosshair stays same
weapon_debug_spread_show 0

// Fast restart bind
bind "F5" "mp_restartgame 1"

// Give all nades bind
bind "F6" "give weapon_smokegrenade; give weapon_flashbang; give weapon_hegrenade; give weapon_molotov; give weapon_incgrenade"

// Teleport to crosshair (Practice positioning)
bind "F7" "getpos_exact; setpos_exact"

// Toggle trajectory
bind "F8" "toggle sv_grenade_trajectory"

// Clear decals (smoke visibility)
bind "c" "r_cleardecals"
