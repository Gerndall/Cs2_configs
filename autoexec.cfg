        bind "space"            +jump
        bind "ctrl"             +duck
        bind "CAPSLOCK"         +voicerecord
        bind "ALT"              +radialradio
		bind "p" "give weapon_ak47;give item_assaultsuit; give weapon_smokegrenade; give weapon_hegrenade; give weapon_flashbang; give weapon_molotov"

	alias "+runthrow" "+forward;+jump;"
