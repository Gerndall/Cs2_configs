//stuff
rate 						"1000000"
mm_dedicated_search_maxping "25"
r_show_build_info 			"0"
alias "q" "quit"	
alias "dc" "disconnect"
alias "exe" "exec autoexec"
alias "c" "clear"
alias "3" "r_drawworld 0; echo world disabled"
alias 1 "echo AFK script Enabled; +forward; +turnleft;"
alias 2 "echo AFK script Disabled; -forward; -turnleft;"
alias "hands" "toggle cl_prefer_lefthanded 0 1; switchhands"
bind "k" "hands"

//Sound
snd_headphone_eq 1
snd_spatialize_lerp 0.5
snd_musicvolume 0.3 
snd_deathcamera_volume 0 
snd_mapobjective_volume 0 
